name: 🐛 Bug Report
description: File a bug or issue with weekly picks, scoring, standings, or authentication
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with **NFL Weekly Pool**! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description of Bug
      description: A clear and concise description of what the issue is.
      placeholder: e.g. Picks submitted for Week 7 did not reflect on the weekly scoreboard.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this problem?
      placeholder: |
        1. Go to '/picks'
        2. Select 'Kansas City Chiefs' in game 3
        3. Click 'Save Picks'
        4. See error message
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Picks should save and update on the scoreboard.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Picks Selection & Submission
        - Scoreboard & ESPN Live Scores
        - Standings & Clutch Records
        - MNF Tiebreaker Scoring
        - Pool Admin & Commissioner Tools
        - Authentication & Profiles
        - Other
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Environment / Device
      description: Browser, Operating System, Screen size (e.g. Chrome 129 on iOS Safari, Windows 11).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Console Logs
      description: Drag and drop screenshots or paste any console / Supabase error logs here.
    validations:
      required: false
